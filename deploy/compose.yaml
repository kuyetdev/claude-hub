services:
  claude-hub:
    image: claude-hub:latest
    container_name: claude-hub
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://100.113.130.61:1780/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
