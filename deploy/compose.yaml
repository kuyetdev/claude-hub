services:
  claude-hub:
    image: claude-hub:latest
    container_name: claude-hub
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:1781/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  claude-hub-nginx:
    image: nginx:1.27-alpine
    container_name: claude-hub-nginx
    restart: unless-stopped
    ports:
      - "1780:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
